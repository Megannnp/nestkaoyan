name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workspace-app/package-lock.json

      - name: Install dependencies
        working-directory: workspace-app
        run: npm ci

      - name: Lint
        working-directory: workspace-app
        run: npm run lint

      - name: Build
        working-directory: workspace-app
        run: npm run build

      - name: Unit tests
        working-directory: workspace-app
        run: npm run test:unit

      - name: Render smoke tests
        working-directory: workspace-app
        run: npm test
